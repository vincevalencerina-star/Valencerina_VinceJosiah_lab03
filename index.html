<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Seminar Registration</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>IT Seminar Registration</h1>
      <p>Fill in your details below. Everything is checked in your browser before your summary appears.</p>
    </header>

    <form id="registrationForm" novalidate>

      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName" autocomplete="name" required
               aria-describedby="fullNameError" aria-invalid="false">
        <p class="error" id="fullNameError"></p>
      </div>

      <div class="field">
        <label for="studentNumber">Student number</label>
        <input type="text" id="studentNumber" name="studentNumber" placeholder="24-1234-123" required
               aria-describedby="studentNumberHint studentNumberError" aria-invalid="false">
        <p class="hint" id="studentNumberHint">Format: 24-1234-123</p>
        <p class="error" id="studentNumberError"></p>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="name@school.edu" required
               aria-describedby="emailError" aria-invalid="false">
        <p class="error" id="emailError"></p>
      </div>

      <div class="field">
        <label for="mobileNumber">Mobile number</label>
        <input type="tel" id="mobileNumber" name="mobileNumber" autocomplete="tel" placeholder="09171234567" required
               aria-describedby="mobileNumberHint mobileNumberError" aria-invalid="false">
        <p class="hint" id="mobileNumberHint">09 or +639 followed by nine digits. No spaces or hyphens.</p>
        <p class="error" id="mobileNumberError"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required
               aria-describedby="passwordFeedback passwordError" aria-invalid="false">
        <p class="feedback" id="passwordFeedback" aria-live="polite"></p>
        <p class="error" id="passwordError"></p>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required
               aria-describedby="confirmPasswordError" aria-invalid="false">
        <p class="error" id="confirmPasswordError"></p>
      </div>

      <div class="field">
        <label for="course">Course</label>
        <select id="course" name="course" required aria-describedby="courseError" aria-invalid="false">
          <option value="" selected>Select your course</option>
          <option value="BSIT">BSIT</option>
          <option value="BSCS">BSCS</option>
        </select>
        <p class="error" id="courseError"></p>
      </div>

      <div class="field field-check">
        <div class="check-row">
          <input type="checkbox" id="terms" name="terms" required
                 aria-describedby="termsError" aria-invalid="false">
          <label for="terms">I agree to the seminar terms and conditions</label>
        </div>
        <p class="error" id="termsError"></p>
      </div>

      <div class="actions">
        <button type="submit" id="registerBtn">Register</button>
        <button type="reset" id="resetBtn">Reset</button>
      </div>
    </form>

    <p id="successMessage" class="success" role="status" hidden></p>

    <section id="registrationSummary" class="summary" aria-label="Registration summary" hidden>
      <h2>Registration summary</h2>
      <dl>
        <dt>Full name</dt>
        <dd id="summaryName"></dd>
        <dt>Student number</dt>
        <dd id="summaryStudentNumber"></dd>
        <dt>Email address</dt>
        <dd id="summaryEmail"></dd>
        <dt>Mobile number</dt>
        <dd id="summaryMobileNumber"></dd>
        <dt>Course</dt>
        <dd id="summaryCourse"></dd>
      </dl>
    </section>
  </main>
</body>
</html>
